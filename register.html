
<!DOCTYPE html>
<html>
<head>
    <title>Smart Hospital - Registration</title>
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<br>
    <div class="hospital-icon">
        <img src="images/logo.jpeg" alt="Hospital Logo" width="100" height="100">
    </div>
    <center>
        <h1>SMART HOSPITAL</h1>
        <h1>Token Booking & Queue Management</h1>
    <div class="register-card">
        <form onsubmit="return validateform()">
            <h2>Create Account</h2>
            <h3>Register as a New Patient</h3>
            <input type="text" id="name" name="name"
                placeholder="Enter your name"><br><br>
            <input type="tel" id="mobileNumber" name="mobileNumber"
                placeholder="Enter your mobile number"><br><br>
            <input type="email" id="email" name="email"
                placeholder="Enter your email"><br><br>
            <input type="password" id="password" name="password"
                placeholder="Enter your password"><br><br>
            <input type="password" id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm password"><br><br>
            <button type="submit">Register</button>
        </form>
        <p class="login-text">
            Already have an Account?
            <a href="login.html">Login here</a>
        </p>
    </div>
    </div>
    </center>   
<script>
    function validateform() {
        let name = document.getElementById("name").value.trim();
        let mobileNumber = document.getElementById("mobileNumber").value.trim();
        let email = document.getElementById("email").value.trim().toLowerCase();
        let password = document.getElementById("password").value;
        let confirmPassword = document.getElementById("confirmPassword").value;
        if (!name || !mobileNumber || !email || !password || !confirmPassword) {
            alert("Please fill in all registration details.");
            return false;
        }
        if (!/^[0-9]{10}$/.test(mobileNumber)) {
            alert("Please enter a valid 10-digit mobile number.");
            return false;
        }
        if (password.length < 6) {
            alert("Password must contain at least 6 characters.");
            return false;
        }
        if (password !== confirmPassword) {
            alert("Password and Confirm Password do not match.");
            return false;
        }
        let patients = JSON.parse(localStorage.getItem("hospitalPatients") || "[]");
        let existingPatient = patients.find(function(patient) {
            return patient.email.toLowerCase() === email;
        });
        if (existingPatient) {
            alert("This email is already registered. Please login.");
            return false;
        }
        let newPatient = {
            name: name,
            mobileNumber: mobileNumber,
            email: email,
            password: password
        };
        patients.push(newPatient);
        localStorage.setItem("hospitalPatients", JSON.stringify(patients));
        alert("Registration Successful! You can now login.");
        window.location.href = "login.html";
        return false;
    }
</script>
</body>
</html>
