
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Smart Hospital - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="pdashboard.css">
</head>
<body>
    <div class="hospital-icon">
        <img src="images/logo.jpeg" alt="Hospital Logo" width="100" height="100">
    </div>
    <center>
        <h1>SMART HOSPITAL</h1>
        <h1>Token Booking & Queue Management</h1>
        <div class="login-card">
            <h2>Login</h2>
            <form id="loginForm" onsubmit="return validateform()">
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your Email"
                    required
                >
                <br><br>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your Password"
                    minlength="6"
                    required
                >
                <br><br>
                <label for="role">Select Role:</label>
                <select name="role" id="role" required>
                    <option value="">Choose Your Role</option>
                    <option value="doctor">Doctor</option>
                    <option value="patient">Patient</option>
                    <option value="receptionist">Receptionist</option>
                    <option value="administrator">administrator</option>
                </select>
                <br><br>
                <button type="submit">
                    Login
                </button>
            </form>
            <p class="register-text">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>
        </div>
    </center>
    <script>
        let email = "";
        let password = "";
        let role = "";
        function validateform() {
            email = document.getElementById("email").value.trim().toLowerCase();
            password = document.getElementById("password").value;
            role = document.getElementById("role").value;
            if (email === "" || password === "" || role === "") {
                alert("Please enter all login details.");
                return false;
            }
            if (password.length < 6) {
                alert("Password must be at least 6 characters long.");
                return false;
            }
            if (email === "doctor@hospital.com" &&
                password === "doctor123" &&
                role === "doctor") {
                alert("Doctor Login Successful!");
                window.location.href = "doctordashboard.html";
            }
            else if (email === "patient@hospital.com" &&
                     password === "patient123" &&
                     role === "patient") {
                alert("Patient Login Successful!");
                window.location.href = "patientdashboard.html";
            }
            else if (email === "receptionist@hospital.com" &&
                     password === "receptionist123" &&
                     role === "receptionist") {

                alert("Receptionist Login Successful!");
                window.location.href = "recept.html";
            }
            else if (email === "admin@hospital.com" &&
                     password === "admin123" &&
                     role === "administrator") {

                alert("Administrator Login Successful!");
                window.location.href = "admin.html";
            }
            else {

                alert("Invalid Email, Password or Role. Please try again.");
            }
            return false;
        }
    </script>
</body>
</html>
