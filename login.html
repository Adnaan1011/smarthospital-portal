
<!DOCTYPE html>
<html lang="en">

<head>
    <title>Smart Hospital - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="pdashboard.css">
    <link rel="stylesheet" href="patientdashboard.html">
</head>

<body>

    <div class="hospital-icon">
    <img src="images/logo.png" alt="Hospital Logo" width="100" height="100">
    </div>

    <center>
        <h1>SMART HOSPITAL</h1>
        <h1>Token Booking & Queue Management</h1>
    <div class="login-card">

        <h2>Login</h2>

        <form onsubmit="return validateform()">

            <input type="email" id="email" name="email"
                placeholder="Enter your Email"><br><br>

            <input type="password" id="password" name="password"
                placeholder="Enter your Password"><br><br>

            <button type="submit"><a href="patientdashboard.html" style="color: white; text-decoration: none;">Login</a></button>

        </form>

        <p class="register-text">
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>
        <label for="role">Select Role:</label>
        <select name="role" id="role">
            <option value="administrator"><a href="doctordashboard.html">Doctor</a></option>
            <option value="project-manager"><a href="patientdashboard.html">Patient</a></option>
            <option value="team-leader"><a href="receptionistdashboard.html">Receptionist</a></option>
        </select>
    </div>
    </center>
    <script>

        function validateform() {

            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;

            if (email === "") {
                alert("Please enter your email");
                return false;
            }

            if (password === "") {
                alert("Please enter your password");
                return false;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters long");
                return false;
            }

            alert("Login form submitted successfully!");

            return false;
        }

    </script>

</body>
</html>
