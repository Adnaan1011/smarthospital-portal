
<!DOCTYPE html>
<html lang="en">

<head>
    <title>Smart Hospital - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="pdashboard.css">
</head>
<body>
    <div class="hospital-icon">
        <img src="images/logo.jpeg" alt="Hospital Logo" width="100" height="100">
    </div>
    <center>
        <h1>SMART HOSPITAL</h1>
        <h1>Token Booking & Queue Management</h1>
        <div class="login-card">
            <h2>Login</h2>
            <form id="loginForm" onsubmit="return validateform()">
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your Email"
                    required
                >
                <br><br>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your Password"
                    minlength="6"
                    required
                >

                <br><br>
                <label for="role">Select Role:</label>
                <select name="role" id="role" required>
                    <option value="">Choose Your Role</option>
                    <option value="doctor">Doctor</option>
                    <option value="patient">Patient</option>
                    <option value="receptionist">Receptionist</option>
                </select>
                <br><br>
                <button type="submit">
                    Login
                </button>
            </form>
            <p class="register-text">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>
        </div>
    </center>
    <script>
        function validateform() {
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let role = document.getElementById("role").value;
            if (email === "") {
                alert("Please enter your email");
                return false;
            }
            if (password === "") {
                alert("Please enter your password");
                return false;
            }
            if (password.length < 6) {
                alert("Password must be at least 6 characters long");
                return false;
            }
            if (role === "") {
                alert("Please select your role");
                return false;
            }
            if (role === "doctor") {
                window.location.href = "doctordashboard.html";
            }
            else if (role === "patient") {
                window.location.href = "patientdashboard.html";
            }
            else if (role === "receptionist") {
                window.location.href = "receptionistdashboard.html";
            }
            return false;
        }
    </script>
</body>
</html>
