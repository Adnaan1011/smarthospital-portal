
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Smart Hospital - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="pdashboard.css">
</head>
<body>
    <div class="hospital-icon">
        <img src="images/logo.jpeg" alt="Hospital Logo" width="100" height="100">
    </div>
    <center>
        <h1>SMART HOSPITAL</h1>
        <h1>Token Booking & Queue Management</h1>
        <div class="login-card">
            <h2>Login</h2>
            <form id="loginForm" onsubmit="return validateform()">
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your Email"
                    required
                >
                <br><br>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your Password"
                    minlength="6"
                    required
                >
                <br><br>
                <label for="role">Select Role:</label>
                <select name="role" id="role" required>
                    <option value="">Choose Your Role</option>
                    <option value="doctor">Doctor</option>
                    <option value="patient">Patient</option>
                    <option value="receptionist">Receptionist</option>
                    <option value="administrator">administrator</option>
                </select>
                <br><br>
                <button type="submit">
                    Login
                </button>
            </form>
            <p class="register-text">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>
        </div>
    </center>
    <script>
function validateform() {
    let email = document.getElementById("email").value.trim().toLowerCase();
    let password = document.getElementById("password").value;
    let role = document.getElementById("role").value;
    if (!email || !password || !role) {
        alert("Please enter all login details.");
        return false;
    }
    let demoAccounts = [
        {
            email: "doctor@hospital.com",
            password: "doctor123",
            role: "doctor",
            page: "doctordashboard.html"
        },
        {
            email: "receptionist@hospital.com",
            password: "receptionist123",
            role: "receptionist",
            page: "recept.html"
        },
        {
            email: "admin@hospital.com",
            password: "admin123",
            role: "administrator",
            page: "admin.html"
        }
    ];
    let account = demoAccounts.find(function(user) {
        return user.email === email &&
               user.password === password &&
               user.role === role;
    });
    if (account) {
        localStorage.setItem("loggedInUser", JSON.stringify({
            email: account.email,
            role: account.role
        }));
        alert("Login Successful!");
        window.location.href = account.page;
        return false;
    }
    if (role === "patient") {
        let patients = JSON.parse(
            localStorage.getItem("hospitalPatients") || "[]"
        );
        let patient = patients.find(function(user) {
            return user.email.toLowerCase() === email &&
                   user.password === password;
        });
        if (patient) {
            localStorage.setItem("loggedInPatient", JSON.stringify({
                name: patient.name,
                email: patient.email,
                mobileNumber: patient.mobileNumber,
                role: "patient"
            }));
            alert("Patient Login Successful!");
            window.location.href = "patientdashboard.html";
            return false;
        }
    }
    alert("Invalid Email, Password or Role. Please try again.");
    return false;
}
</script>
</body>
</html>
