<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="appointment.css">
</head>
<body>
    <center>
        <h1> SMART HOSPITAL </h1>
        <h1>   Token Booking  </h1>
        <h2> Please fill in the details below </h2><br>
        <form onsubmit="return validateform()"></form>
    <form class="row g-3">
  <div class="col-md-4">
    <label for="validationServer01" class="form-label">First name--</label>
    <input type="text" class="form-control is-valid" id="validationServer01" value="Mark" required>
    <div class="valid-feedback">
    </div>
  </div><br>
  <div class="col-md-4">
    <label for="validationServer02" class="form-label">Last name--</label>
    <input type="text" class="form-control is-valid" id="validationServer02" value="Otto" required>
    <div class="valid-feedback">
    </div>
  </div><br>
    <label for="validationServerUsername" class="form-label"></label>
    <div class="input-group has-validation">
      <span class="input-group-text" id="inputGroupPrepend3">Email--</span>
      <input type="text" class="form-control is-invalid" id="validationServerUsername" aria-describedby="inputGroupPrepend3 validationServerUsernameFeedback" required>
      <div id="validationServerUsernameFeedback" class="invalid-feedback">
      </div>
    </div>
  </div><br>
  <div class="col-md-6">
    <label for="validationServer03" class="form-label">patient ID--</label>
    <input type="text" class="form-control is-invalid" id="validationServer03" aria-describedby="validationServer03Feedback" required>
    <div id="validationServer03Feedback" class="invalid-feedback">
    </div>
  </div><br>
  <div class="input-group has-validation">
      <span class="input-group-text" id="inputGroupPrepend3">Doctor Name--</span>
      <input type="text" class="form-control is-invalid" id="validationServerUsername" aria-describedby="inputGroupPrepend3 validationServerUsernameFeedback" required>
      <div id="validationServerUsernameFeedback" class="invalid-feedback">
      </div>
    </div><br>
  <div class="col-md-3">
    <label for="validationServer04" class="form-label">Specialization--</label>
    <select class="form-select is-invalid" id="validationServer04" aria-describedby="validationServer04Feedback" required>
      <option selected disabled value="">Cardiology</option>
      <option>Neurosurgery</option>
      <option>Orthopedics</option>
    </select>
    <div id="validationServer04Feedback" class="invalid-feedback">
    </div>
  </div><br>
  <div class="col-12">
    <div class="form-check">
      <input class="form-check-input is-invalid" type="checkbox" value="" id="invalidCheck3" aria-describedby="invalidCheck3Feedback" required>
      <label class="form-check-label" for="invalidCheck3">
        Agree to terms and conditions
      </label>
      <div id="invalidCheck3Feedback" class="invalid-feedback">
        You must agree before submitting.
      </div>
    </div>
  </div><br><br>
  <div class="col-12">
    <button class="btn btn-primary" type="submit">Book Appointment</button>
  </div>
</div>
</form>
</body>
</center>
    <script>

        function validateform() {

            let firstname = document.getElementById("firstname").value.trim();
            let lastname = document.getElementById("lastname").value.trim();
            let email = document.getElementById("email").value.trim();
            let patientID = document.getElementById("patientID").value.trim();
            let DoctorName = document.getElementById("DoctorName").value.trim();
            let specialization = document.getElementById("specialization").value.trim();

            if (firstname === "") {
                alert("Please enter your first name");
                return false;
            }

            if (lastname === "") {
                alert("Please enter your last name");
                return false;
            }

            if (patientID === "") {
                alert("Please enter your patient ID");
                return false;
            }

            if (email === "") {
                alert("Please enter your email");
                return false;
            }

            if (DoctorName === "") {
                alert("Please enter the doctor's name");
                return false;
            }

            if (specialization === "") {
                alert("Please select a specialization");
                return false;
            }

            alert("appointment form submitted successfully!");

            return false;
        }

    </script>

</body>
</html>
</html>
