
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hospital - Token Booking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="appointment.css">
</head>
<body>
    <center>
        <img src="images/image.png" alt="Hospital Logo" width="500" height="200">
        <h1>Token Booking</h1>
        <h2>Please fill in the details below</h2>
        <div class="booking-card">
            <form id="appointmentForm" onsubmit="return validateform()">
                <div class="mb-3 text-start">
                    <label for="firstname" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstname" placeholder="Enter first name" required>
                </div>
                <div class="mb-3 text-start">
                    <label for="lastname" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastname" placeholder="Enter last name" required>
                </div>
                <div class="mb-3 text-start">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required readonly>
                </div>
                <div class="mb-3 text-start">
                    <label for="patientID" class="form-label">Patient ID</label>
                    <input type="text" class="form-control" id="patientID" placeholder="Patient ID" required readonly>
                </div>
                <div class="mb-3 text-start">
                    <label for="DoctorName" class="form-label">Doctor Name</label>
                    <select class="form-select" id="DoctorName" required>
                        <option value="">Choose a Doctor</option>
                    </select>
                </div>
                <div class="mb-3 text-start">
                    <label for="specialization" class="form-label">Specialization</label>
                    <select class="form-select" id="specialization" required>
                        <option value="">Choose Specialization</option>
                    </select>
                </div>
                <div class="mb-3 text-start">
                    <label for="appointmentDate" class="form-label">Appointment Date</label>
                    <input type="date" class="form-control" id="appointmentDate" required>
                </div>
                <div class="mb-3 text-start">
                    <label for="appointmentTime" class="form-label">Appointment Time</label>
                    <select class="form-select" id="appointmentTime" required disabled>
                        <option value="">Choose Doctor and Date First</option>
                    </select>
                </div>
                <div class="form-check text-start mb-3">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label" for="terms">
                        I agree to the terms and conditions
                    </label>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    Book Appointment
                </button>
            </form>
        </div>
    </center>
    <script>
        let loggedInPatient = JSON.parse(localStorage.getItem("loggedInPatient"));
        let patient = null;
        let availableDoctors = [];
        if (!loggedInPatient || loggedInPatient.role !== "patient") {
            alert("Please login as a patient first.");
            window.location.href = "login.html";
        } else {
            let patients = JSON.parse(localStorage.getItem("hospitalPatients")) || [];
            patient = patients.find(function(p) {
                return p.email && p.email.toLowerCase() === loggedInPatient.email.toLowerCase();
            });
            if (!patient) {
                alert("Patient details not found. Please register again.");
                window.location.href = "register.html";
            } else {
                let patientName = patient.name || loggedInPatient.name || "";
                let nameParts = patientName.trim().split(" ");
                document.getElementById("firstname").value = nameParts.shift() || "";
                document.getElementById("lastname").value = nameParts.join(" ");
                document.getElementById("email").value = patient.email;
                if (!patient.patientId || patient.patientId === "Not Assigned") {
                    patient.patientId = "PAT" + Math.floor(100000 + Math.random() * 900000);
                    localStorage.setItem("hospitalPatients", JSON.stringify(patients));
                }
                document.getElementById("patientID").value = patient.patientId;
                let today = new Date();
                let year = today.getFullYear();
                let month = String(today.getMonth() + 1).padStart(2, "0");
                let day = String(today.getDate()).padStart(2, "0");
                document.getElementById("appointmentDate").min = `${year}-${month}-${day}`;
                loadDoctors();
            }
        }
        function getAppointments() {
            try {
                let appointments = JSON.parse(localStorage.getItem("hospitalAppointments")) || [];
                return Array.isArray(appointments) ? appointments : [];
            } catch {
                return [];
            }
        }
        function isSlotBooked(doctorName, appointmentDate, appointmentTime) {
            let appointments = getAppointments();
            return appointments.some(function(appointment) {
                let savedDoctor = String(appointment.doctor || "").trim().toLowerCase();
                let savedDate = String(appointment.date || "").trim().slice(0, 10);
                let savedTime = String(appointment.time || "").trim().toUpperCase();
                let savedStatus = String(appointment.status || "").trim().toUpperCase();
                return savedDoctor === doctorName.trim().toLowerCase() &&
                    savedDate === appointmentDate &&
                    savedTime === appointmentTime.trim().toUpperCase() &&
                    savedStatus !== "CANCELLED";
            });
        }
        function loadDoctors() {
            try {
                availableDoctors = JSON.parse(localStorage.getItem("hospitalDoctors")) || [];
                if (!Array.isArray(availableDoctors)) {
                    availableDoctors = [];
                }
            } catch {
                availableDoctors = [];
            }
            let doctorDropdown = document.getElementById("DoctorName");
            let specializationDropdown = document.getElementById("specialization");
            doctorDropdown.innerHTML = '<option value="">Choose a Doctor</option>';
            specializationDropdown.innerHTML = '<option value="">Choose Specialization</option>';
            if (availableDoctors.length === 0) {
                doctorDropdown.innerHTML = '<option value="">No doctors currently available</option>';
                doctorDropdown.disabled = true;
                specializationDropdown.disabled = true;
                updateTimeSlots();
                return;
            }
            doctorDropdown.disabled = false;
            specializationDropdown.disabled = false;
            availableDoctors.forEach(function(doctor) {
                let option = document.createElement("option");
                option.value = doctor.name;
                option.textContent = doctor.name;
                doctorDropdown.appendChild(option);
            });
            updateTimeSlots();
        }
        function updateSpecialization() {
            let selectedDoctor = document.getElementById("DoctorName").value;
            let specializationDropdown = document.getElementById("specialization");
            specializationDropdown.innerHTML = '<option value="">Choose Specialization</option>';
            let doctor = availableDoctors.find(function(item) {
                return item.name === selectedDoctor;
            });
            if (doctor) {
                let option = document.createElement("option");
                option.value = doctor.department;
                option.textContent = doctor.department;
                option.selected = true;
                specializationDropdown.appendChild(option);
            }
            updateTimeSlots();
        }
        function convertTimeToMinutes(time) {
            let match = time.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
            if (!match) {
                return null;
            }
            let hours = Number(match[1]);
            let minutes = Number(match[2]);
            let period = match[3].toUpperCase();
            if (hours < 1 || hours > 12 || minutes < 0 || minutes > 59) {
                return null;
            }
            if (period === "AM" && hours === 12) {
                hours = 0;
            } else if (period === "PM" && hours !== 12) {
                hours += 12;
            }
            return hours * 60 + minutes;
        }
        function convertMinutesToTime(totalMinutes) {
            let hours = Math.floor(totalMinutes / 60);
            let minutes = totalMinutes % 60;
            let period = hours >= 12 ? "PM" : "AM";
            let displayHours = hours % 12;
            if (displayHours === 0) {
                displayHours = 12;
            }
            return String(displayHours).padStart(2, "0") + ":" +
                String(minutes).padStart(2, "0") + " " + period;
        }
        function updateTimeSlots() {
            let doctorName = document.getElementById("DoctorName").value;
            let appointmentDate = document.getElementById("appointmentDate").value;
            let timeDropdown = document.getElementById("appointmentTime");
            timeDropdown.innerHTML = '<option value="">Choose Time Slot</option>';
            timeDropdown.disabled = true;
            if (!doctorName || !appointmentDate) {
                timeDropdown.innerHTML = '<option value="">Choose Doctor and Date First</option>';
                return;
            }
            let selectedDoctor = availableDoctors.find(function(doctor) {
                return doctor.name === doctorName;
            });
            if (!selectedDoctor || !selectedDoctor.time) {
                timeDropdown.innerHTML = '<option value="">Doctor Timing Not Available</option>';
                return;
            }
            let timeRange = selectedDoctor.time.split(/\s*[-–—]\s*/);
            if (timeRange.length !== 2) {
                timeDropdown.innerHTML = '<option value="">Invalid Doctor Timing</option>';
                return;
            }
            let startTime = convertTimeToMinutes(timeRange[0]);
            let endTime = convertTimeToMinutes(timeRange[1]);
            if (startTime === null || endTime === null || endTime <= startTime) {
                timeDropdown.innerHTML = '<option value="">Invalid Doctor Timing</option>';
                return;
            }
            let availableSlots = [];
            for (let time = startTime; time < endTime; time += 30) {
                let slot = convertMinutesToTime(time);
                if (!isSlotBooked(doctorName, appointmentDate, slot)) {
                    availableSlots.push(slot);
                }
            }
            if (availableSlots.length === 0) {
                timeDropdown.innerHTML = '<option value="">No Available Slots</option>';
                return;
            }
            availableSlots.forEach(function(slot) {
                let option = document.createElement("option");
                option.value = slot;
                option.textContent = slot;

                timeDropdown.appendChild(option);
            });
            timeDropdown.disabled = false;
        }
        document.getElementById("DoctorName").addEventListener("change", updateSpecialization);
        document.getElementById("appointmentDate").addEventListener("change", updateTimeSlots);
        function validateform() {
            let firstname = document.getElementById("firstname").value.trim();
            let lastname = document.getElementById("lastname").value.trim();
            let email = document.getElementById("email").value.trim();
            let patientID = document.getElementById("patientID").value.trim();
            let DoctorName = document.getElementById("DoctorName").value;
            let specialization = document.getElementById("specialization").value;
            let appointmentDate = document.getElementById("appointmentDate").value;
            let appointmentTime = document.getElementById("appointmentTime").value;
            let terms = document.getElementById("terms").checked;
            if (!firstname || !lastname) {
                alert("Please enter your name.");
                return false;
            }
            if (!email || !patientID || patientID === "Not Assigned") {
                alert("Patient details are missing. Please open your dashboard first.");
                return false;
            }
            if (!DoctorName) {
                alert("Please select a doctor.");
                return false;
            }
            let selectedDoctor = availableDoctors.find(function(item) {
                return item.name === DoctorName;
            });
            if (!selectedDoctor) {
                alert("This doctor is no longer available. Please refresh the page.");
                return false;
            }
            if (!specialization || specialization !== selectedDoctor.department) {
                alert("Please select the correct doctor's department.");
                return false;
            }
            if (!appointmentDate) {
                alert("Please select an appointment date.");
                return false;
            }
            let selectedDate = new Date(appointmentDate + "T00:00:00");
            let currentDate = new Date();
            currentDate.setHours(0, 0, 0, 0);
            if (selectedDate < currentDate) {
                alert("Please select today or a future date.");
                return false;
            }
            if (!appointmentTime) {
                alert("Please select an available appointment time.");
                return false;
            }
            let timeRange = selectedDoctor.time.split(/\s*[-–—]\s*/);
            if (timeRange.length !== 2) {
                alert("Doctor timing is invalid. Please contact the hospital.");
                return false;
            }
            let startTime = convertTimeToMinutes(timeRange[0]);
            let endTime = convertTimeToMinutes(timeRange[1]);
            let selectedTime = convertTimeToMinutes(appointmentTime);
            if (startTime === null || endTime === null ||
                selectedTime === null ||
                selectedTime < startTime ||
                selectedTime >= endTime ||
                (selectedTime - startTime) % 30 !== 0) {
                alert("Please select a valid time within the doctor's available hours.");
                updateTimeSlots();
                return false;
            }
            if (!terms) {
                alert("Please agree to the terms and conditions.");
                return false;
            }
            if (isSlotBooked(DoctorName, appointmentDate, appointmentTime)) {
                alert("This time slot is already booked. Please select another available time.");
                updateTimeSlots();
                return false;
            }
            let appointments = getAppointments();
            let tokenNumber = appointments.length + 1;
            let token = "T" + String(tokenNumber).padStart(3, "0");
            let sameDayAppointments = appointments.filter(function(appointment) {
                return String(appointment.doctor || "").trim().toLowerCase() === DoctorName.trim().toLowerCase() &&
                    String(appointment.date || "").trim().slice(0, 10) === appointmentDate &&
                    String(appointment.status || "").trim().toUpperCase() !== "CANCELLED";

            });
            let queuePosition = sameDayAppointments.length + 1;
            let newAppointment = {
                appointmentId: Date.now(),
                patientName: firstname + " " + lastname,
                patientEmail: email,
                patientId: patientID,
                doctor: DoctorName,
                department: specialization,
                date: appointmentDate,
                time: appointmentTime,
                status: "CONFIRMED",
                token: token,
                queuePosition: queuePosition,
                servingToken: "Not Available",
                waitingCount: queuePosition - 1
            };
            appointments.push(newAppointment);
            localStorage.setItem(
                "hospitalAppointments",
                JSON.stringify(appointments)
            );
            alert(
                "Appointment booked successfully!\n\nYour Token Number: " +
                token +
                "\nQueue Position: " +
                queuePosition
            );
            window.location.href = "patientdashboard.html";
            return false;
        }
        window.addEventListener("storage", function(event) {
            if (event.key === "hospitalDoctors") {
                loadDoctors();
            }
            if (event.key === "hospitalAppointments") {
                updateTimeSlots();
            }
        });
    </script>
</body>
</html>
