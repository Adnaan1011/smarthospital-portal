
<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="appointment.css">
</head>
<body>
    <center>
      <img src="images/image.png" alt="Hospital Logo" width="500" height="200">
        <h1>Token Booking</h1>
        <h2>Please fill in the details below</h2>
        <div class="booking-card">
            <form id="appointmentForm" onsubmit="return validateform()">
                <div class="mb-3 text-start">
                    <label for="firstname" class="form-label">First Name</label>
                    <input type="text" class="form-control"
                           id="firstname" placeholder="Enter first name" required>
                </div>
                <div class="mb-3 text-start">
                    <label for="lastname" class="form-label">Last Name</label>
                    <input type="text" class="form-control"
                           id="lastname" placeholder="Enter last name" required>
                </div>
                <div class="mb-3 text-start">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control"
                           id="email" placeholder="Enter your email" required>
                </div>
                <div class="mb-3 text-start">
                    <label for="patientID" class="form-label">Patient ID</label>
                    <input type="text" class="form-control"
                           id="patientID" placeholder="Enter patient ID" required>
                </div>
                <div class="mb-3 text-start">
                    <label for="DoctorName" class="form-label">Doctor Name</label>
                    <select class="form-select" id="DoctorName" required>
                        <option value="">Choose a Doctor</option>
                        <option value="Dr. Rahul Sharma">Dr. Rahul Sharma</option>
                        <option value="Dr. Priya Reddy">Dr. Priya Reddy</option>
                        <option value="Dr. Anil Kumar">Dr. Anil Kumar</option>
                    </select>
                </div>
                <div class="mb-3 text-start">
                    <label for="specialization" class="form-label">Specialization</label>
                    <select class="form-select" id="specialization" required>
                        <option value="">Choose Specialization</option>
                        <option value="Cardiology">Cardiology</option>
                        <option value="Neurosurgery">Neurosurgery</option>
                        <option value="Orthopedics">Orthopedics</option>
                    </select>
                </div>
                <div class="mb-3 text-start">
                    <label for="appointmentDate" class="form-label">Appointment Date</label>
                    <input type="date" class="form-control"
                           id="appointmentDate" required>
                </div>
                <div class="mb-3 text-start">
                    <label for="appointmentTime" class="form-label">Appointment Time</label>
                    <select class="form-select" id="appointmentTime" required>
                        <option value="">Choose Time Slot</option>
                        <option value="09:00 AM">09:00 AM</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="11:00 AM">11:00 AM</option>
                        <option value="12:00 PM">12:00 PM</option>
                        <option value="02:00 PM">02:00 PM</option>
                        <option value="03:00 PM">03:00 PM</option>
                    </select>
                </div>
                <div class="form-check text-start mb-3">
                    <input class="form-check-input" type="checkbox"
                           id="terms" required>

                    <label class="form-check-label" for="terms">
                        I agree to the terms and conditions
                    </label>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    Book Appointment
                </button>
            </form>
          </div>
    </center>
    <script>
        function validateform() {
            let firstname = document.getElementById("firstname").value.trim();
            let lastname = document.getElementById("lastname").value.trim();
            let email = document.getElementById("email").value.trim();
            let patientID = document.getElementById("patientID").value.trim();
            let DoctorName = document.getElementById("DoctorName").value;
            let specialization = document.getElementById("specialization").value;
            let appointmentDate = document.getElementById("appointmentDate").value;
            let appointmentTime = document.getElementById("appointmentTime").value;
            let terms = document.getElementById("terms").checked;
            if (firstname === "") {
                alert("Please enter your first name");
                return false;
            }

            if (lastname === "") {
                alert("Please enter your last name");
                return false;
            }

            if (email === "") {
                alert("Please enter your email");
                return false;
            }

            if (patientID === "") {
                alert("Please enter your patient ID");
                return false;
            }

            if (DoctorName === "") {
                alert("Please select a doctor");
                return false;
            }

            if (specialization === "") {
                alert("Please select a specialization");
                return false;
            }

            if (appointmentDate === "") {
                alert("Please select an appointment date");
                return false;
            }

            let selectedDate = new Date(appointmentDate + "T00:00:00");
            let today = new Date();
            today.setHours(0, 0, 0, 0);

            if (selectedDate < today) {
                alert("Please select today or a future date");
                return false;
            }

            if (appointmentTime === "") {
                alert("Please select an appointment time");
                return false;
            }

            if (!terms) {
                alert("Please agree to the terms and conditions");
                return false;
            }

            alert("Appointment form submitted successfully!");

            document.getElementById("appointmentForm").reset();

            return false;
        }
    </script>
</body>
</html>
